[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddings-quality"
version = "0.1.0"
description = "Audit SSL embedding separability in the original feature space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4,<2", "loguru>=0.7,<1"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "build>=1", "ruff>=0.11", "mypy>=1.15", "pandas-stubs>=2.0"]

[project.scripts]
embeddings-quality = "embeddings_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embeddings_quality = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
